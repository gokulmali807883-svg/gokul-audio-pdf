<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>गोकुळ ऑडिओ पीडीएफ रीडर</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    body {
      background-color: #121212;
      color: #FFFFFF;
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
    }
    .status-box {
      background: #1e1e1e;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 16px;
      width: 90%;
      max-width: 450px;
      margin-bottom: 20px;
      font-size: 18px;
      text-align: center;
    }
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 90%;
      max-width: 450px;
    }
    button, label.upload-btn {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 20px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      display: block;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    button:active, label.upload-btn:active {
      background-color: #1d4ed8;
    }
    .btn-secondary {
      background-color: #374151;
    }
    .btn-row {
      display: flex;
      gap: 12px;
    }
    .btn-row button {
      flex: 1;
    }
    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <h1 aria-label="गोकुळ ऑडिओ पीडीएफ रीडर">Gokul Audio PDF Reader</h1>

  <div class="status-box" id="status" aria-live="polite">
    कृपया पहिली पीडीएफ फाईल निवडा.
  </div>

  <div class="btn-container">
    <label class="upload-btn" for="pdfInput" tabindex="0" role="button" aria-label="पीडीएफ फाईल निवडा">
      📂 पीडीएफ फाईल निवडा (Open PDF)
    </label>
    <input type="file" id="pdfInput" accept="application/pdf">

    <button id="playPauseBtn" class="btn-secondary" aria-label="वाचन सुरू करा किंवा थांबवा">
      ▶️ वाचा / थांबा (Play / Pause)
    </button>

    <div class="btn-row">
      <button id="prevBtn" class="btn-secondary" aria-label="मागील पान">⏮️ मागील पान</button>
      <button id="nextBtn" class="btn-secondary" aria-label="पुढील पान">⏭️ पुढील पान</button>
    </div>

    <div class="btn-row">
      <button id="rewindBtn" class="btn-secondary" aria-label="दहा सेकंद मागे">⏪ १० सेकंद मागे</button>
      <button id="forwardBtn" class="btn-secondary" aria-label="दहा सेकंद पुढे">⏩ १० सेकंद पुढे</button>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;
    let isSpeaking = false;
    let utterance = null;
    let pageText = "";

    const statusEl = document.getElementById('status');
    const pdfInput = document.getElementById('pdfInput');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    pdfInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusEl.innerText = "पीडीएफ लोड होत आहे, थोडा वेळ थांबा...";
      const fileReader = new FileReader();

      fileReader.onload = async function() {
        const typedarray = new Uint8Array(this.result);
        pdfDoc = await pdfjsLib.getDocument(typedarray).promise;
        totalPages = pdfDoc.numPages;
        currentPage = 1;
        statusEl.innerText = `पीडीएफ लोड झाली. एकूण पाने: ${totalPages}. पान १ सुरू.`;
        loadPageText(currentPage, true);
      };

      fileReader.readAsArrayBuffer(file);
    });

    async function loadPageText(pageNum, autoPlay = false) {
      if (!pdfDoc) return;
      window.speechSynthesis.cancel();
      isSpeaking = false;

      const page = await pdfDoc.getPage(pageNum);
      const textContent = await page.getTextContent();
      pageText = textContent.items.map(item => item.str).join(' ');

      statusEl.innerText = `पान ${pageNum} पैकी ${totalPages}`;

      if (autoPlay && pageText.trim().length > 0) {
        speakText(pageText);
      }
    }

    function speakText(text) {
      if (!text || text.trim() === "") {
        statusEl.innerText = "या पानावर वाचण्यासाठी कोणताही मजकूर नाही.";
        return;
      }
      window.speechSynthesis.cancel();

      utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;

      utterance.onstart = () => {
        isSpeaking = true;
        playPauseBtn.innerText = "⏸️ थांबा (Pause)";
      };

      utterance.onend = () => {
        isSpeaking = false;
        playPauseBtn.innerText = "▶️ वाचा (Play)";
        if (currentPage < totalPages) {
          currentPage++;
          loadPageText(currentPage, true);
        }
      };

      window.speechSynthesis.speak(utterance);
    }

    playPauseBtn.addEventListener('click', () => {
      if (!pdfDoc) return;

      if (window.speechSynthesis.speaking) {
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
          playPauseBtn.innerText = "⏸️ थांबा (Pause)";
        } else {
          window.speechSynthesis.pause();
          playPauseBtn.innerText = "▶️ वाचा (Play)";
        }
      } else {
        speakText(pageText);
      }
    });

    prevBtn.addEventListener('click', () => {
      if (pdfDoc && currentPage > 1) {
        currentPage--;
        loadPageText(currentPage, true);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (pdfDoc && currentPage < totalPages) {
        currentPage++;
        loadPageText(currentPage, true);
      }
    });
  </script>
</body>
</html>
